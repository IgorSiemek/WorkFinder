name: WorkFinder CI and Hetzner deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Build and smoke test the production image
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t workfinder:ci .
          docker run --rm workfinder:ci python -m app.cli init

  deploy:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: workfinder-production
      cancel-in-progress: false
    env:
      PROD_VM_HOST: ${{ vars.PROD_VM_HOST || secrets.PROD_VM_HOST }}
      PROD_VM_USER: ${{ vars.PROD_VM_USER || secrets.PROD_VM_USER }}
      PROD_VM_SSH_PORT: ${{ vars.PROD_VM_SSH_PORT || secrets.PROD_VM_SSH_PORT || '22' }}
      PROD_VM_APP_DIR: ${{ vars.PROD_VM_APP_DIR || '/opt/workfinder' }}
    steps:
      - name: Validate deployment settings
        env:
          SSH_KEY: ${{ secrets.PROD_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for key in PROD_VM_HOST PROD_VM_USER SSH_KEY; do
            test -n "${!key}" || { echo "Missing GitHub variable or secret: $key"; exit 1; }
          done
          [[ "$PROD_VM_APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$PROD_VM_SSH_PORT" =~ ^[0-9]+$ ]]
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VM_SSH_PRIVATE_KEY }}
      - name: Deploy the tested commit
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            -p "$PROD_VM_SSH_PORT" "$PROD_VM_USER@$PROD_VM_HOST" \
            "bash -s -- '$PROD_VM_APP_DIR' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          deploy_sha="$2"
          cd "$app_dir"
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$deploy_sha" || {
            echo "A newer commit is available. Its workflow will deploy the new version."
            exit 0
          }
          git checkout --detach "$deploy_sha"
          test -s .env
          test -d data
          export APP_BUILD_REF="$deploy_sha"
          docker compose config --quiet
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 150
          container_id="$(docker compose ps -q workfinder)"
          test -n "$container_id"
          running_ref="$(docker inspect "$container_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$running_ref" = "$deploy_sha"
          docker compose ps
          REMOTE
