name: WorkFinder CI and Hetzner deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==26.3 && python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Build and smoke test the production image
        run: |
          sudo apparmor_parser -r deploy/apparmor-workfinder
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t workfinder:ci .
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/workfinder:uid=10001,gid=10001 \
            --cap-drop ALL --cap-add SYS_CHROOT --security-opt no-new-privileges:true \
            --security-opt apparmor=workfinder-browser \
            --security-opt seccomp=deploy/seccomp-chromium.json \
            --tmpfs /app/data:uid=10001,gid=10001 workfinder:ci python -m app.cli init
          docker build -t workfinder:ci-tests -f - . <<'DOCKERFILE'
          FROM workfinder:ci
          USER root
          COPY requirements-dev.txt requirements.txt /tmp/test-requirements/
          RUN pip install -r /tmp/test-requirements/requirements-dev.txt
          USER workfinder
          DOCKERFILE
          docker run --rm --read-only --network none --shm-size 256m \
            --tmpfs /tmp --tmpfs /home/workfinder:uid=10001,gid=10001 \
            --tmpfs /app/data:uid=10001,gid=10001 \
            --cap-drop ALL --cap-add SYS_CHROOT --security-opt no-new-privileges:true \
            --security-opt apparmor=workfinder-browser \
            --security-opt seccomp=deploy/seccomp-chromium.json \
            -e RUN_BROWSER_TESTS=1 -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
            workfinder:ci-tests python -m pytest /tests/test_application_browser.py -q -p no:cacheprovider

  deploy:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: workfinder-production
      cancel-in-progress: false
    env:
      PROD_VM_HOST: ${{ vars.PROD_VM_HOST }}
      PROD_VM_USER: ${{ vars.PROD_VM_USER }}
      PROD_VM_SSH_PORT: ${{ vars.PROD_VM_SSH_PORT || '22' }}
      PROD_VM_SSH_HOST_KEY: ${{ vars.PROD_VM_SSH_HOST_KEY }}
    steps:
      - name: Deploy the tested commit through the restricted SSH command
        env:
          SSH_KEY: ${{ secrets.PROD_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for key in PROD_VM_HOST PROD_VM_USER PROD_VM_SSH_HOST_KEY SSH_KEY; do
            test -n "${!key}" || { echo "Missing deployment setting $key"; exit 1; }
          done
          [[ "$PROD_VM_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$PROD_VM_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$PROD_VM_SSH_PORT" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/workfinder_deploy
          trap 'rm -f ~/.ssh/workfinder_deploy' EXIT
          host="$PROD_VM_HOST"
          if [[ "$PROD_VM_SSH_PORT" != 22 ]]; then host="[$host]:$PROD_VM_SSH_PORT"; fi
          printf '%s %s\n' "$host" "$PROD_VM_SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -i ~/.ssh/workfinder_deploy \
            -p "$PROD_VM_SSH_PORT" "$PROD_VM_USER@$PROD_VM_HOST" "deploy $GITHUB_SHA"
